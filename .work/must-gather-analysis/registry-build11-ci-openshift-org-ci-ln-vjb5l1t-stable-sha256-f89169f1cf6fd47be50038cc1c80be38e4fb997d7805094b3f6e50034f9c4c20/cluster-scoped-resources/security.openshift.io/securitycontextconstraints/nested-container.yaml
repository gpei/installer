    include.release.openshift.io/single-node-developer: "true"
    kubernetes.io/description: 'nested-container is specially tailored for running
      nested containers. It balances a tight security profile, while remaining loose
      enough to be useful to run nested containers in. In addition to requiring pods
      run with a user namespace, it allows SETUID and SETGID capabilities, requires
      the "container_engine_t" SELinux type, allows any users within the range of
      0-65534, allows privilege escalation (to allow a container engine to run new{uid/gid}map),
      and allows any seccomp profile. Since any pods running within this SCC must
      use a user namespace ("hostUsers: false"), their actual UID/GID on the host
      will be allocated by the kubelet to be unprivileged, and any capabilities the
      pod is granted will not apply outside of the pods user namespace.'
