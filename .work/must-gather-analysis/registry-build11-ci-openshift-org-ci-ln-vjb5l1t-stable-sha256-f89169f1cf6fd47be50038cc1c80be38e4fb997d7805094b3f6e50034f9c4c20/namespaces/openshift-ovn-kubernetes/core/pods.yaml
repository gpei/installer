    name: ovnkube-control-plane-74c65dbd9b-gbdrw
    namespace: openshift-ovn-kubernetes
    ownerReferences:
    - apiVersion: apps/v1
      blockOwnerDeletion: true
      controller: true
      kind: ReplicaSet
      name: ovnkube-control-plane-74c65dbd9b
      uid: 5853b216-0da6-4dce-897f-c455d0022de0
