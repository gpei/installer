        fi
        if [[ "true" == "true" ]]; then
          if [[ "true" != "true" ]]; then
            multi_network_enabled_flag="--enable-multi-network"
          fi
          network_segmentation_enabled_flag="--enable-network-segmentation"
        fi

        route_advertisements_enable_flag=
