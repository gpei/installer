    name: machine-config-nodes-crd-cleanup
    namespace: openshift-machine-config-operator
    ownerReferences:
    - apiVersion: config.openshift.io/v1
      kind: ClusterVersion
      name: version
      uid: 0370d296-6904-481d-ab90-157c7e5b835a
    resourceVersion: "10933"
    uid: 1c2bdeae-06a3-42f2-830f-3132f1073474
  spec:
    concurrencyPolicy: Forbid
    failedJobsHistoryLimit: 1
    jobTemplate:
      metadata:
        creationTimestamp: null
      spec:
        template:
          metadata:
            annotations:
              openshift.io/required-scc: nonroot-v2
              target.workload.openshift.io/management: '{"effect": "PreferredDuringScheduling"}'
            creationTimestamp: null
            labels:
              app: machine-config-nodes-crd-cleanup
          spec:
            containers:
            - command:
              - /bin/bash
              - -c
              - |
                set -euo pipefail

                # Set trap to suspend cronjob on successful exit (exit code 0)
                trap 'if [ $? -eq 0 ]; then echo "Suspending cronjob..."; oc patch cronjob machine-config-nodes-crd-cleanup -p "{\"spec\":{\"suspend\":true}}" --field-manager=machine-config-operator || echo "Failed to suspend cronjob"; fi' EXIT

                CRD_NAME="machineconfignodes.machineconfiguration.openshift.io"

                echo "Checking for MachineConfigNodes CRD with v1alpha1 version..."

                # Check if CRD exists
                if ! CRD_CHECK_OUTPUT=$(oc get crd "$CRD_NAME" 2>&1); then
                  echo "Error checking for CRD $CRD_NAME: $CRD_CHECK_OUTPUT"
                  echo "Assuming CRD does not exist, nothing to clean up"
                  exit 0
                fi

                # Check if CRD has v1alpha1 version
                if ! HAS_V1ALPHA1=$(oc get crd "$CRD_NAME" -o jsonpath='{.spec.versions[?(@.name=="v1alpha1")].name}' 2>&1); then
                  echo "Error checking CRD versions for $CRD_NAME: $HAS_V1ALPHA1"
                  echo "v1 version likely exists, skipping cleanup"
                  exit 0
                fi

                if [ -z "$HAS_V1ALPHA1" ]; then
                  echo "CRD $CRD_NAME does not have v1alpha1 version, nothing to clean up"
                  exit 0
                fi

                echo "Found CRD $CRD_NAME with v1alpha1 version, deleting it..."

                # Delete the CRD
                if DELETE_OUTPUT=$(oc delete crd "$CRD_NAME" 2>&1); then
                  echo "Successfully deleted CRD $CRD_NAME"
                else
                  echo "Failed to delete CRD $CRD_NAME"
                  echo "Delete error output: $DELETE_OUTPUT"
                  exit 1
                fi

                echo "CRD cleanup completed successfully"
              image: registry.build11.ci.openshift.org/ci-ln-vjb5l1t/stable@sha256:56380161baf19863b676fb94aacaae253df853c437df18d00e447f36c895b794
              imagePullPolicy: IfNotPresent
              name: crd-cleanup
              resources:
                requests:
                  cpu: 10m
                  memory: 50Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: FallbackToLogsOnError
            dnsPolicy: ClusterFirst
            nodeSelector:
              node-role.kubernetes.io/master: ""
            priorityClassName: system-cluster-critical
            restartPolicy: OnFailure
            schedulerName: default-scheduler
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              seccompProfile:
                type: RuntimeDefault
            serviceAccount: machine-config-operator
            serviceAccountName: machine-config-operator
            terminationGracePeriodSeconds: 30
            tolerations:
            - effect: NoSchedule
              key: node-role.kubernetes.io/master
              operator: Exists
            - effect: NoExecute
              key: node.kubernetes.io/unreachable
              operator: Exists
              tolerationSeconds: 120
            - effect: NoExecute
              key: node.kubernetes.io/not-ready
              operator: Exists
              tolerationSeconds: 120
    schedule: '* * * * *'
    successfulJobsHistoryLimit: 3
    suspend: true
  status:
    lastScheduleTime: "2026-01-28T09:27:00Z"
