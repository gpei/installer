  name: catalogd-controller-manager
  namespace: openshift-catalogd
  resourceVersion: "9299"
  uid: 241246cf-e8d4-4364-8c3f-8fdbe912e685
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      control-plane: catalogd-controller-manager
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        openshift.io/required-scc: privileged
        target.workload.openshift.io/management: '{"effect": "PreferredDuringScheduling"}'
      creationTimestamp: null
      labels:
        control-plane: catalogd-controller-manager
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - arm64
                - ppc64le
                - s390x
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      containers:
      - args:
        - --leader-elect
        - --metrics-bind-address=:7443
        - --external-address=catalogd-service.openshift-catalogd.svc
        - --tls-cert=/var/certs/tls.crt
        - --tls-key=/var/certs/tls.key
        - --v=4
        - --global-pull-secret=openshift-config/pull-secret
        command:
        - ./catalogd
        env:
        - name: SSL_CERT_DIR
          value: /var/ca-certs
        image: registry.build11.ci.openshift.org/ci-ln-vjb5l1t/stable@sha256:f7d0d3af8ca46727b17eae293799af55706dedd1ff2e9ef0fa73f804fd7a93fa
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 1
        name: manager
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /var/cache/
          name: cache
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/certs
          name: catalogserver-certs
        - mountPath: /var/ca-certs
          name: ca-certs
          readOnly: true
        - mountPath: /etc/containers
          name: etc-containers
          readOnly: true
        - mountPath: /etc/docker
          name: etc-docker
          readOnly: true
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/os: linux
        node-role.kubernetes.io/master: ""
      priorityClassName: system-cluster-critical
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
        seLinuxOptions:
          type: spc_t
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: catalogd-controller-manager
      serviceAccountName: catalogd-controller-manager
      terminationGracePeriodSeconds: 10
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoExecute
        key: node.kubernetes.io/unreachable
        operator: Exists
        tolerationSeconds: 120
      - effect: NoExecute
        key: node.kubernetes.io/not-ready
        operator: Exists
        tolerationSeconds: 120
      volumes:
      - emptyDir: {}
        name: cache
      - emptyDir: {}
        name: tmp
      - name: catalogserver-certs
        secret:
          defaultMode: 420
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
          optional: false
          secretName: catalogserver-cert
      - name: ca-certs
        projected:
          defaultMode: 420
          sources:
          - configMap:
              items:
              - key: ca-bundle.crt
                path: ca-bundle.crt
              name: catalogd-trusted-ca-bundle
              optional: false
          - configMap:
              items:
              - key: service-ca.crt
                path: service-ca.crt
              name: openshift-service-ca.crt
              optional: false
      - hostPath:
          path: /etc/containers
          type: Directory
        name: etc-containers
      - hostPath:
          path: /etc/docker
          type: Directory
        name: etc-docker
