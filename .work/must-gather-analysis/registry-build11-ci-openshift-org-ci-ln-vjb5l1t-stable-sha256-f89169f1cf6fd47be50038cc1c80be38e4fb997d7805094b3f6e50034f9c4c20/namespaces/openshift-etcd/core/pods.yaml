        exec nice -n -19 ionice -c2 -n0 etcd \
          --logger=zap \
          --log-level=info \
          --experimental-initial-corrupt-check=true \
          --snapshot-count=10000 \
          --initial-advertise-peer-urls=https://${NODE_ip_10_0_102_200_us_west_1_compute_internal_IP}:2380 \
