- apiVersion: v1
  data:
    forceRedeploymentReason: ""
    pod.yaml: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: etcd\n  namespace: openshift-etcd\n
      \ labels:\n    app: etcd\n    k8s-app: etcd\n    etcd: \"true\"\n    revision:
      \"REVISION\"\nspec:\n  containers:\n  - name: etcd\n    image: registry.build11.ci.openshift.org/ci-ln-vjb5l1t/stable@sha256:08c3b0ce55cb2bd5fceb69b280043a6a004571e784bb505854e4cc66f38af6a6\n
      \   imagePullPolicy: IfNotPresent\n    terminationMessagePolicy: FallbackToLogsOnError\n
      \   command:\n      - /bin/sh\n      - -c\n      - |\n        #!/bin/sh\n        set
      -euo pipefail\n               \n        export ETCD_NAME=${NODE_NODE_ENVVAR_NAME_ETCD_NAME}\n
      \       export ETCD_INITIAL_CLUSTER=\"${ETCD_NAME}=https://${NODE_NODE_ENVVAR_NAME_ETCD_URL_HOST}:2380\"\n
      \       env | grep ETCD | grep -v NODE\n        export ETCD_NODE_PEER_URL=https://${NODE_NODE_ENVVAR_NAME_ETCD_URL_HOST}:2380\n
      \       export REV_JSON=\"/var/lib/etcd-backup/revision.json\"\n        export
      SNAPSHOT_FILE=\"/var/lib/etcd-backup/snapshot.db\"\n\n        # checking if
      data directory is empty, if not etcdctl restore will fail         \n        if
      [ -n \"$(ls -A \"/var/lib/etcd\")\" ]; then\n          echo \"please delete
      the contents of the /var/lib/etcd directory before restoring, running the restore
      script will do this for you\"\n          exit 1\n        fi\n        \n        ETCD_ETCDCTL_BIN=\"etcdctl\"\n
      \       if [ -x \"$(command -v etcdutl)\" ]; then\n          echo \"found etcdutl,
      using that instead of etcdctl for local operations\"\n          ETCD_ETCDCTL_BIN=\"etcdutl\"\n
      \       fi      \n\n        # check if we have backup file to be restored\n
      \       # if the file exist, check if it has not changed size in last 5 seconds\n
      \       if [ ! -f \"${SNAPSHOT_FILE}\" ]; then\n          echo \"please make
      a copy of the snapshot db file, then move that copy to ${SNAPSHOT_FILE}\"\n
      \         exit 1\n        else\n          filesize=$(stat --format=%s \"${SNAPSHOT_FILE}\")\n
      \         sleep 5\n          newfilesize=$(stat --format=%s \"${SNAPSHOT_FILE}\")\n
      \         if [ \"$filesize\" != \"$newfilesize\" ]; then\n            echo \"file
      size has changed since last 5 seconds, retry sometime after copying is complete\"\n
      \           exit 1\n          fi\n        fi\n        \n        SNAPSHOT_REV=$(etcdutl
      snapshot status -wjson \"$SNAPSHOT_FILE\" | jq -r \".revision\")\n        echo
      \"snapshot is at revision ${SNAPSHOT_REV}\"\n        \n        if [ -n \"$(ls
      -A \"${REV_JSON}\")\" ]; then\n           # this will bump by the amount of
      the last known live revision + 20% slack.\n           # Note: the bump amount
      is an addition to the current revision stored in the snapshot.\n           #
      We're avoiding to do any math with SNAPSHOT_REV, uint64 has plenty of space
      to double revisions\n           # and we're assuming that full disaster restores
      are a very rare occurrence anyway.\n           BUMP_REV=$(jq -r \"(.maxRaftIndex*1.2|floor)\"
      \"${REV_JSON}\")\n           echo \"bumping revisions by ${BUMP_REV}\"\n        else\n
      \          # we can't take SNAPSHOT_REV as an indicator here, because the snapshot
      might be much older\n           # than any currently live served revision. \n
      \          # 1bn would be an etcd running at 1000 writes/s for about eleven
      days.\n           echo \"no revision.json found, assuming a 1bn revision bump\"\n
      \          BUMP_REV=1000000000\n        fi\n        \n        UUID=$(uuidgen)\n
      \       echo \"restoring to a single node cluster\"\n        ${ETCD_ETCDCTL_BIN}
      snapshot restore \"${SNAPSHOT_FILE}\" \\\n         --name $ETCD_NAME \\\n         --initial-cluster=$ETCD_INITIAL_CLUSTER
      \\\n         --initial-cluster-token \"openshift-etcd-${UUID}\" \\\n         --initial-advertise-peer-urls
      $ETCD_NODE_PEER_URL \\\n         --data-dir=\"/var/lib/etcd/restore-${UUID}\"
      \\\n         --mark-compacted \\\n         --bump-revision \"${BUMP_REV}\"\n\n
      \       mv /var/lib/etcd/restore-${UUID}/* /var/lib/etcd/\n        # copy the
      revision.json back in case a second restore needs to be run afterwards\n        if
      [ -n \"$(ls -A \"${REV_JSON}\")\" ]; then\n           cp ${REV_JSON} /var/lib/etcd/\n
      \       fi\n\n        rmdir /var/lib/etcd/restore-${UUID}\n        rm /var/lib/etcd-backup/snapshot.db\n\n
      \       set -x\n        exec etcd \\\n          --logger=zap \\\n          --log-level=info
      \\\n          --initial-advertise-peer-urls=https://${NODE_NODE_ENVVAR_NAME_IP}:2380
      \\\n          --cert-file=/etc/kubernetes/static-pod-certs/secrets/etcd-all-certs/etcd-serving-NODE_NAME.crt
      \\\n          --key-file=/etc/kubernetes/static-pod-certs/secrets/etcd-all-certs/etcd-serving-NODE_NAME.key
      \\\n          --trusted-ca-file=/etc/kubernetes/static-pod-certs/configmaps/etcd-all-bundles/server-ca-bundle.crt
      \\\n          --client-cert-auth=true \\\n          --peer-cert-file=/etc/kubernetes/static-pod-certs/secrets/etcd-all-certs/etcd-peer-NODE_NAME.crt
      \\\n          --peer-key-file=/etc/kubernetes/static-pod-certs/secrets/etcd-all-certs/etcd-peer-NODE_NAME.key
      \\\n          --peer-trusted-ca-file=/etc/kubernetes/static-pod-certs/configmaps/etcd-all-bundles/server-ca-bundle.crt
      \\\n          --peer-client-cert-auth=true \\\n          --advertise-client-urls=https://${NODE_NODE_ENVVAR_NAME_IP}:2379
      \\\n          --listen-client-urls=https://0.0.0.0:2379 \\\n          --listen-peer-urls=https://0.0.0.0:2380
      \\\n          --metrics=extensive \\\n          --listen-metrics-urls=https://0.0.0.0:9978\n
      \   env:\n      - name: \"ALL_ETCD_ENDPOINTS\"\n        value: \"https://10.0.102.200:2379,https://10.0.108.54:2379,https://10.0.3.203:2379\"\n
      \     - name: \"ETCDCTL_API\"\n        value: \"3\"\n      - name: \"ETCDCTL_CACERT\"\n
      \       value: \"/etc/kubernetes/static-pod-certs/configmaps/etcd-all-bundles/server-ca-bundle.crt\"\n
      \     - name: \"ETCDCTL_CERT\"\n        value: \"/etc/kubernetes/static-pod-certs/secrets/etcd-all-certs/etcd-peer-NODE_NAME.crt\"\n
      \     - name: \"ETCDCTL_ENDPOINTS\"\n        value: \"https://10.0.102.200:2379,https://10.0.108.54:2379,https://10.0.3.203:2379\"\n
      \     - name: \"ETCDCTL_KEY\"\n        value: \"/etc/kubernetes/static-pod-certs/secrets/etcd-all-certs/etcd-peer-NODE_NAME.key\"\n
      \     - name: \"ETCD_CIPHER_SUITES\"\n        value: \"TLS_AES_128_GCM_SHA256,TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256\"\n
      \     - name: \"ETCD_DATA_DIR\"\n        value: \"/var/lib/etcd\"\n      - name:
      \"ETCD_ELECTION_TIMEOUT\"\n        value: \"1000\"\n      - name: \"ETCD_ENABLE_PPROF\"\n
      \       value: \"true\"\n      - name: \"ETCD_EXPERIMENTAL_MAX_LEARNERS\"\n
      \       value: \"3\"\n      - name: \"ETCD_EXPERIMENTAL_WARNING_APPLY_DURATION\"\n
      \       value: \"200ms\"\n      - name: \"ETCD_EXPERIMENTAL_WATCH_PROGRESS_NOTIFY_INTERVAL\"\n
      \       value: \"5s\"\n      - name: \"ETCD_HEARTBEAT_INTERVAL\"\n        value:
      \"100\"\n      - name: \"ETCD_IMAGE\"\n        value: \"registry.build11.ci.openshift.org/ci-ln-vjb5l1t/stable@sha256:08c3b0ce55cb2bd5fceb69b280043a6a004571e784bb505854e4cc66f38af6a6\"\n
      \     - name: \"ETCD_INITIAL_CLUSTER_STATE\"\n        value: \"existing\"\n
      \     - name: \"ETCD_QUOTA_BACKEND_BYTES\"\n        value: \"8589934592\"\n
      \     - name: \"ETCD_SOCKET_REUSE_ADDRESS\"\n        value: \"true\"\n      -
      name: \"ETCD_TLS_MIN_VERSION\"\n        value: \"TLS1.2\"\n      - name: \"NODE_ip_10_0_102_200_us_west_1_compute_internal_ETCD_NAME\"\n
